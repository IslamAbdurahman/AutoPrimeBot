[program:autoprime-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/bot_autoprim_usr/data/www/bot.autoprime.uz/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=bot_autoprim_usr
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/bot_autoprim_usr/data/www/bot.autoprime.uz/storage/logs/worker.log
stopwaitsecs=3600

[program:autoprime-scheduler]
process_name=%(program_name)s
command=php /var/www/bot_autoprim_usr/data/www/bot.autoprime.uz/artisan schedule:work
autostart=true
autorestart=true
user=bot_autoprim_usr
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/bot_autoprim_usr/data/www/bot.autoprime.uz/storage/logs/scheduler.log
